# Phase 1 speed and memory on one A100-80G: BF16 vs INT8 per-expert DiT step time at two lengths.
# Every denoising step does the same work, so 10 steps (about 7 high-noise, 3 low-noise) give the
# per-step times; 40-step totals are derived from them. Run once per load configuration:
#   python benchmarks/wan22/bench.py --config benchmarks/wan22/configs/speed_sweep.yaml --output-dir DIR
#   ... --runner-arg gemm_quantization=int8
runner_args:
  model: Wan2.2-T2V
  attention_backend: CUDNN
  # guidance 4.0 / 3.0 and flow_shift 12 are the Wan2.2-T2V defaults; spelled out so results state them.
  guidance_scale: 4.0
  guidance_scale_2: 3.0
  flow_shift: 12
cases:
  - {name: 480p_33f, height: 480, width: 832, num_frames: 33, num_inference_steps: 10}
  - {name: 480p_81f, height: 480, width: 832, num_frames: 81, num_inference_steps: 10}
prompts:
  - A golden retriever running across a sunlit meadow, slow motion, shallow depth of field.
seeds: [42]
repeats: 1
warmup: 1
save_videos: none
