# Phase 1 quality runs: one video per prompt and seed at 480p / 33 frames, for compare_videos.py and VBench.
# dev.txt is for trying the flow; for reported numbers pass --prompts-file with a larger list
# (docs/wan22_tp_int8/phase1_runbook.md).
runner_args:
  model: Wan2.2-T2V
  attention_backend: CUDNN
  guidance_scale: 4.0
  guidance_scale_2: 3.0
  flow_shift: 12
cases:
  - {name: 480p_33f, height: 480, width: 832, num_frames: 33, num_inference_steps: 40}
prompts_file: benchmarks/wan22/prompts/dev.txt
seeds: [42]
repeats: 1
warmup: 1
save_videos: first_repeat
